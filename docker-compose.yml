version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: fitmentor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fitmentor_db}
      POSTGRES_USER: ${DB_USER:-fitmentor_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fitmentor_secret_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fitmentor_admin} -d ${DB_NAME:-fitmentor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # FitMentor AI Full-Stack App Service (Express Backend + React SPA Frontend)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitmentor_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-fitmentor_admin}:${DB_PASSWORD:-fitmentor_secret_password}@db:5432/${DB_NAME:-fitmentor_db}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-fitmentor_super_secret_jwt_key_2026_change_in_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${PORT:-5000}:5000"

volumes:
  postgres_data:
    driver: local

