services:
  - type: web
    name: fitmentor-ai
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fitmentor-db
          property: connectionString

databases:
  - name: fitmentor-db
    plan: free
    databaseName: fitmentor_db
    user: fitmentor_admin

